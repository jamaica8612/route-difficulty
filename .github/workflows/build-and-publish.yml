name: Build and publish route-difficulty

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: route-difficulty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
      - run: python -m pip install -r scripts/requirements-data.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify browser bundle has no server credentials
        run: |
          if grep -R -E 'PUBLIC_DATA_SERVICE_KEY|serviceKey=' dist; then
            echo 'Server credential marker found in browser bundle' >&2
            exit 1
          fi

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: route-difficulty-web
            dockerfile: Dockerfile
          - image: route-difficulty-builder
            dockerfile: Dockerfile.builder
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_NAVER_MAP_CLIENT_ID=${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
          tags: |
            ghcr.io/jamaica8612/${{ matrix.image }}:main
            ghcr.io/jamaica8612/${{ matrix.image }}:${{ github.sha }}
